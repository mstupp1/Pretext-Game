<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17110d" />
  <title>Lexicon Crossing</title>
  <meta name="description" content="Catch letters from rivers of flowing prose and ink words before time runs dry. A typographic word chase powered by Pretext." />
</head>
<body>
  <div id="game-container">
    <div id="game-wrapper">
      <div class="book-cover" aria-hidden="true"></div>
      <canvas id="game-canvas" aria-label="Lexicon Crossing game board" role="img"></canvas>
    </div>
    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-icon"></div>
        <p>Turn your device sideways<br />to open the book.</p>
      </div>
    </div>
    <p id="boot-error" hidden>Something went wrong while opening the book. Please reload the page.</p>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
